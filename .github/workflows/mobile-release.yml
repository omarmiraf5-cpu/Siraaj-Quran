# Release builds, run by hand: GitHub → Actions → "Mobile apps — release"
# → Run workflow. Enter the version people will see (1.0.0, 1.0.1, …).
#
# iOS uploads moved to .github/workflows/ios-release.yml. That workflow
# reuses the existing distribution certificate. This file's iOS job only
# points there, so a run here cannot create another certificate.
#
# Android: builds the signed app bundle (.aab) for Google Play and leaves
# it on the run page to download and upload in Play Console. Needs:
#   ANDROID_KEYSTORE_BASE64   — the upload key file, base64-encoded
#   ANDROID_KEYSTORE_PASSWORD — its password
#   ANDROID_KEY_ALIAS         — the key's alias
#   ANDROID_KEY_PASSWORD      — the key's password
#
# The Android run number becomes that app's build number, so every upload
# is higher than the last. iOS build numbers are chosen by the other workflow.
name: Mobile apps — release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version shown in the stores, e.g. 1.0.0"
        required: true
        default: "1.0.0"
      platform:
        description: "Which app to build"
        type: choice
        options: [both, ios, android]
        default: both

jobs:
  ios:
    name: iOS → TestFlight
    if: inputs.platform != 'android'
    runs-on: ubuntu-latest
    steps:
      - name: Use the iOS TestFlight workflow
        run: |
          echo "::error::iOS builds moved to Actions → iOS → TestFlight (.github/workflows/ios-release.yml). That workflow reuses distribution certificate M6TPLDDU24. This job does not upload, so it cannot create another certificate. See docs/ios-app-store-release.md."
          exit 1

  android:
    name: Android → app bundle for Google Play
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Check the secrets are set
        run: |
          missing=""
          for v in KEYSTORE_B64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secrets for:$missing (see the top of mobile-release.yml)"
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npx cap sync android
      - name: Upload key
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
      - name: Build the signed app bundle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: ${{ inputs.version }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: MyDiiwaan-${{ inputs.version }}-build-${{ github.run_number }}-google-play
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
      - name: Summary
        run: echo "Signed app bundle for version ${{ inputs.version }} (build ${{ github.run_number }}) is attached to this run — download it and upload it in Google Play Console." >> "$GITHUB_STEP_SUMMARY"
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"
