<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>MyDiiwaan</title>
  <!-- Shown by the app when mydiiwaan.com can't be reached (capacitor.config
       server.errorPath). Everything here is inline: there is no network. -->
  <style>
    :root { color-scheme: light dark; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      display: flex; align-items: center; justify-content: center;
      padding: calc(24px + env(safe-area-inset-top)) 24px calc(24px + env(safe-area-inset-bottom));
      background: radial-gradient(ellipse 90% 60% at 50% 0%, #2a4a7f 0%, transparent 65%),
                  linear-gradient(160deg, #0e2347, #1c3159 60%, #13223d);
      color: #fff; font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
    }
    main { max-width: 360px; }
    .mark { width: 72px; height: 72px; margin: 0 auto 20px; border-radius: 18px;
            background: url("mark.png") center / cover; box-shadow: 0 12px 32px rgba(0,0,0,.4); }
    h1 { font: 700 26px/1.2 Georgia, serif; margin: 0 0 10px; }
    h1 span { color: #d9bd74; }
    p { margin: 0 0 8px; color: rgba(255,255,255,.78); }
    p[dir="rtl"] { font-size: 15px; }
    button {
      margin-top: 22px; padding: 13px 28px; border: 0; border-radius: 14px;
      background: #d9bd74; color: #0e2347; font-weight: 700; font-size: 15px;
    }
    button:active { transform: scale(.97); }
  </style>
</head>
<body>
  <main>
    <div class="mark" role="img" aria-label="MyDiiwaan"></div>
    <h1>My<span>Diiwaan</span></h1>
    <p>You're offline. Check your internet connection, then try again.</p>
    <p>Internetka ma lihid. Hubi xiriirkaaga, kadibna mar kale isku day.</p>
    <p dir="rtl">أنت غير متصل بالإنترنت. تحقق من اتصالك ثم حاول مرة أخرى.</p>
    <button type="button" onclick="retry()">Try again · Isku day · أعد المحاولة</button>
  </main>
  <script>
    function retry() {
      window.location.href = "https://mydiiwaan.com/login";
    }
    // Come back on our own as soon as the connection does.
    window.addEventListener("online", retry);
  </script>
</body>
</html>
